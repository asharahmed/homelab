# pySigma processing pipeline for the homelab's custom JSON log sources.
#
# The Windows/Sysmon rules in rules/windows/ convert natively with the bundled
# `sysmon` pipeline. The custom-application rules in rules/custom/ (Caddy,
# Authelia, Docker) read structured JSON whose field names differ per SIEM, so
# they need this field-mapping pipeline. Field targets below assume Sentinel
# custom-table column names (the `_s` suffix convention); adjust per backend.
#
# Usage:
#   sigma convert -t kusto -p pipelines/homelab-custom.yml rules/custom/
#
# This is an experimental starting point — extend the field_name_mapping as the
# custom rules grow.

name: homelab-custom-sources
priority: 50

transformations:
  - id: caddy_field_mapping
    type: field_name_mapping
    mapping:
      c-uri: RequestURI_s
      c-ip: RemoteIP_s
      sc-status: Status_d
    rule_conditions:
      - type: logsource
        category: webserver

  - id: authelia_field_mapping
    type: field_name_mapping
    mapping:
      msg: Message_s
      remote_ip: RemoteIP_s
      level: Level_s
    rule_conditions:
      - type: logsource
        product: authelia

  - id: docker_field_mapping
    type: field_name_mapping
    mapping:
      Type: EventType_s
      Action: Action_s
      privileged: Privileged_b
    rule_conditions:
      - type: logsource
        product: docker
