title: Credential Access Attempt Against LSASS
id: a1f3c0de-1005-4a05-8b05-0d2e4f6a8c05
status: experimental
description: >
  Detects a process opening a handle to lsass.exe, the core behavior behind
  LSASS memory credential dumping (e.g. Mimikatz, comsvcs.dll).
references:
  - https://attack.mitre.org/techniques/T1003/001/
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1003.001/T1003.001.md  # tests #2, #1, #9
author: homelab detection engineering (ported from Wazuh rule 100540)
date: 2026-06-29
tags:
  - attack.t1003.001
logsource:
  category: process_access
  product: windows
detection:
  selection:
    TargetImage|endswith: '\lsass.exe'
  condition: selection
falsepositives:
  - 'AV/EDR and legitimate security tooling routinely open lsass'
  - 'Windows processes (wininit.exe, csrss.exe, services.exe)'
  - 'PRODUCTION TUNING: filter on GrantedAccess (e.g. 0x1010, 0x1410) and known-good SourceImage to cut noise'
level: high
