title: Authelia Failed TOTP Authentication
id: a1f3c0de-2004-4b04-8b04-0d2e4f6a8d04
name: authelia_failed_totp
status: experimental
description: Detects a single failed TOTP (second-factor) authentication in Authelia.
references:
  - https://attack.mitre.org/techniques/T1110/
author: homelab detection engineering (ported from Wazuh rule 100312)
date: 2026-06-29
tags:
  - attack.t1110
# Custom JSON log source — requires pipelines/homelab-custom.yml for field mapping.
logsource:
  product: authelia
  service: authentication
detection:
  selection:
    level: 'warn'
    msg|contains: 'Unsuccessful TOTP authentication attempt'
  condition: selection
falsepositives:
  - Users mistyping or using an expired TOTP code
level: medium
---
title: Authelia TOTP Brute Force
id: a1f3c0de-2004-4b04-8b04-0d2e4f6a8d05
status: experimental
description: >
  Detects 3 or more failed TOTP attempts from the same source within 5 minutes
  — second-factor brute force, often following a compromised password.
references:
  - https://attack.mitre.org/techniques/T1110/001/
author: homelab detection engineering (ported from Wazuh rule 100313)
date: 2026-06-29
tags:
  - attack.t1110.001
correlation:
  type: event_count
  rules:
    - authelia_failed_totp
  group-by:
    - remote_ip
  timespan: 5m
  condition:
    gte: 3
level: high
