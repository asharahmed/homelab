title: Caddy Authentication Failure Response
id: a1f3c0de-2006-4b06-ab06-0d2e4f6a8d07
name: caddy_auth_failure
status: experimental
description: Detects a 401/403 authentication-failure response from the Caddy reverse proxy.
references:
  - https://attack.mitre.org/techniques/T1110/
author: homelab detection engineering (ported from Wazuh rule 100202/100206)
date: 2026-06-29
tags:
  - attack.t1110
# Custom JSON log source — requires pipelines/homelab-custom.yml for field mapping.
logsource:
  category: webserver
detection:
  selection:
    sc-status:
      - 401
      - 403
  condition: selection
falsepositives:
  - Users hitting protected resources before authenticating
level: low
---
title: Caddy Repeated Auth Failures - Possible Credential Stuffing
id: a1f3c0de-2006-4b06-ab06-0d2e4f6a8d08
status: experimental
description: >
  Detects 8 or more authentication-failure responses from the same client IP
  within 5 minutes through the reverse proxy — credential stuffing or password
  spraying against a published service.
references:
  - https://attack.mitre.org/techniques/T1110/
author: homelab detection engineering (ported from Wazuh rule 100206)
date: 2026-06-29
tags:
  - attack.t1110
correlation:
  type: event_count
  rules:
    - caddy_auth_failure
  group-by:
    - c-ip
  timespan: 5m
  condition:
    gte: 8
level: high
