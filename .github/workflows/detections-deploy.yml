name: Detections Deploy

# Continuous deployment of detection content on merge to main.
# Auth: Microsoft Entra Workload Identity Federation (OIDC) for ARM — no
# secrets stored in GitHub for Azure. The Defender Graph app uses its own
# client-credentials (stored as GitHub secrets) because the custom-detection
# API isn't ARM.
#
# One-time setup (see detections/docs/detection-lifecycle.md):
#   - App registration with a federated credential for
#       repo:asharahmed/homelab_private:environment:production
#     granted "Microsoft Sentinel Contributor" on rg-sentinel.
#   - Repo secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
#     DEFENDER_APP_ID, DEFENDER_APP_SECRET
#   - A GitHub "production" environment with required reviewers (approval gate).

on:
  push:
    branches: [main]
    paths:
      - 'detections/sentinel/**'
      - 'detections/defender/**'
  workflow_dispatch:

permissions:
  id-token: write   # request the OIDC token
  contents: read

env:
  RESOURCE_GROUP: rg-sentinel
  WORKSPACE_NAME: law-homelab

jobs:
  deploy:
    name: Deploy detection content
    runs-on: ubuntu-latest
    environment: production   # manual-approval gate before touching the live workspace
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r detections/requirements.txt

      - name: Verify analytics-rules.json is in sync (defence in depth)
        working-directory: detections/sentinel
        run: |
          python generate-rules.py
          git diff --exit-code analytics-rules.json

      - name: Azure login (OIDC — no stored secret)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Sentinel analytics rules
        run: |
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file detections/sentinel/main.bicep \
            --parameters workspaceName="$WORKSPACE_NAME" ruleSet=@detections/sentinel/analytics-rules.json \
            --name "detections-$(git rev-parse --short HEAD)" \
            --output table

      - name: Deploy Defender custom detections (Graph app-only)
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          DEFENDER_APP_ID: ${{ secrets.DEFENDER_APP_ID }}
          DEFENDER_APP_SECRET: ${{ secrets.DEFENDER_APP_SECRET }}
        run: |
          # the deploy script reads these three keys from .env at the repo root
          @(
            "AZURE_TENANT_ID=$env:AZURE_TENANT_ID"
            "DEFENDER_APP_ID=$env:DEFENDER_APP_ID"
            "DEFENDER_APP_SECRET=$env:DEFENDER_APP_SECRET"
          ) | Set-Content .env
          ./detections/defender/deploy-custom-detections.ps1
          Remove-Item .env -Force
